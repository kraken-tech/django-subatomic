
[lint]
select = ["ALL"]
ignore = [
    "COM812", # Trailing comma missing
    "CPY001", # We do not include copyright notices in individual files
    "D1", # Missing docstring in {}
    "D200", # One-line docstring should fit on one line
    "D203", # 1 blank line required before class docstring
    "D212", # Multi-line docstring summary should start at the first line
    "D413", # Missing blank line after last section ("{name}")
    "E501", # Line too long
    "N818", # Exception name `...` should be named with an Error suffix
    "PT007",  # Wrong values type in `pytest.mark.parametrize` expected `list` of `tuple`
    "RET505", # Unnecessary `else` after `return` statement
    # The following rules may cause conflicts when used with the formatter: `...`. To avoid
    # unexpected behavior, we recommend disabling these rules, either by removing them from the
    # `select` or `extend-select` configuration, or adding them to the `ignore` configuration.
    "ISC001",  # Implicitly concatenated string literals on one line
]

[lint.per-file-ignores]
# Allow unused imports in `__init__.py` files as these are convenience imports.
"__init__.py" = [ "F401" ]
"tests/*.py" = [  # pragma: alphabetize
    "PLR2004",  # allow comparison to values
    "S101",  # allow `assert` for test assertions
    "SIM117",  # allow nested `with` statements for clarity
]

"tests/**" = [
    "ANN", # Type hints
    "FBT001",  # Boolean-typed positional argument in function definition
]

[lint.isort]
lines-after-imports = 2
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "project",
    "local-folder",
]

[lint.isort.sections]
"project" = [
    "django_subatomic",
    "tests",
]
